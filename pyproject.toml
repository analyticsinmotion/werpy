[build-system]
build-backend = 'mesonpy'
requires = [
    'meson-python==0.22.1',
    'meson==1.12.1',
    'Cython==3.3.0'
]

[project]
name = 'werpy'
version = '4.0.0'
description = 'A powerful yet lightweight Python package to calculate and analyze the Word Error Rate (WER).'
readme = 'README.md'
requires-python = '>=3.11'
license = 'BSD-3-Clause'
license-files = ['LICENSE']
authors = [
  {name = 'Ross Armstrong', email = 'ross.armstrong@analyticsinmotion.com'},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
    "Topic :: Text Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed"
]
keywords = [
    "werpy",
    "wer",
    "word error rate",
    "asr",
    "automatic speech recognition",
    "stt",
    "speech-to-text",
    "levenshtein distance",
    "text similarity",
    "nlp",
    "accuracy metrics"
]
dependencies = []

[project.urls]
"Repository" = "https://github.com/analyticsinmotion/werpy"
"Documentation" = "https://werpy.readthedocs.io/"
"Bug Tracker" = "https://github.com/analyticsinmotion/werpy/issues"
"Changelog" = "https://github.com/analyticsinmotion/werpy/blob/main/CHANGELOG.md"


[project.optional-dependencies]
pandas = [
    "pandas>=2.2.2",
]
polars = [
    "polars>=1.0.0",
]
docs = [
    'sphinx==9.1.0; python_version >= "3.12"',
    'sphinx-nefertiti==0.9.11; python_version >= "3.12"',
]
test = [
    "pytest>=9.0.3",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "polars>=1.0.0",
]
benchmarks = [
    "datasets>=4.4.1",
    "werx>=0.3.1",
    "jiwer>=4.0.0",
]

[tool.meson-python]
limited-api = true

[tool.meson-python.wheel]
exclude = ['*.lib']

[tool.mypy]
files = ['werpy']
strict = true

[tool.coverage.paths]
source = ['werpy', '*/site-packages/werpy']
