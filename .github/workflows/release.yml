name: Build and upload to PyPI

# Set default permissions for all jobs in the workflow
permissions:
  contents: read

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
#  push:
#    branches: [ "main" ]
#  pull_request:
#    branches: [ "main" ]
  # Schedule the workflow to trigger at a specified time each day using a CRON expression
  # schedule:
    #        ┌───────────── minute (0 - 59)
    #        │  ┌───────────── hour (0 - 23)
    #        │  │ ┌───────────── day of the month (1 - 31)
    #        │  │ │ ┌───────────── month (1 - 12 or JAN-DEC)
    #        │  │ │ │ ┌───────────── day of the week (0 - 6 or SUN-SAT)
    #        │  │ │ │ │
    # - cron: '25 0 * * *'  # Runs at 12:25am UTC every day

  # Allows you to run this workflow manually from the Actions tab.
  # The run must be started from a release tag (v*); see the check_ref job.
  workflow_dispatch:

jobs:
  check_ref:
    name: Check that the run is from a release tag
    runs-on: ubuntu-latest
    steps:
      - name: Require a v* tag
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [[ "$GITHUB_REF_NAME" != v[0-9]* ]]; then
            echo "::error::This workflow publishes to PyPI and must be run from a release tag (v*), not from $GITHUB_REF_TYPE $GITHUB_REF_NAME"
            exit 1
          fi
          echo "Release tag: $GITHUB_REF_NAME"

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: [check_ref]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build wheels
        uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_ARCHS: auto64
          CIBW_SKIP: "*-win32 *-manylinux_i686"
          # Install every built wheel into a clean environment and run the test suite against it
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest {package}/tests
        #    ...
        with:
        #   package-dir: .
          output-dir: wheelhouse
        #   config-file: "{package}/pyproject.toml"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    needs: [check_ref]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_all:
    needs: [build_wheels, build_sdist]
    environment: pypi
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        # unpacks all CIBW artifacts into dist/
        pattern: cibw-*
        path: dist
        merge-multiple: true

    # CHECK: List the files before publishing
    - name: List artifacts before upload
      run: |
        echo "Listing files in ./dist:"
        ls -lh dist/

    # CHECK: The version in the metadata of every sdist and wheel must equal the tag without its leading "v"
    - name: Check that every distribution carries the tagged version
      env:
        TAG: ${{ github.ref_name }}
      run: |
        python3 - <<'EOF'
        import glob
        import os
        import re
        import sys
        import tarfile
        import zipfile

        expected = os.environ["TAG"].removeprefix("v")
        versions = {}

        def metadata_version(text):
            return re.search(r"^Version: (.+)$", text, re.MULTILINE).group(1).strip()

        for path in sorted(glob.glob("dist/*.tar.gz")):
            with tarfile.open(path) as sdist:
                member = next(m for m in sdist.getmembers() if m.name.count("/") == 1 and m.name.endswith("/PKG-INFO"))
                versions[path] = metadata_version(sdist.extractfile(member).read().decode())

        for path in sorted(glob.glob("dist/*.whl")):
            with zipfile.ZipFile(path) as wheel:
                name = next(n for n in wheel.namelist() if n.count("/") == 1 and n.endswith(".dist-info/METADATA"))
                versions[path] = metadata_version(wheel.read(name).decode())

        for path, version in versions.items():
            print(f"{version}  {path}")

        if not versions:
            sys.exit("No sdist or wheel found in dist/")

        mismatched = sorted({v for v in versions.values() if v != expected})
        if mismatched:
            sys.exit(f"Tag {os.environ['TAG']} expects version {expected} but the distributions carry {mismatched}")

        print(f"All {len(versions)} distributions carry version {expected}")
        EOF

    # CHECK: Validate the metadata of every distribution before upload
    - name: Check the distributions with twine
      run: pipx run twine check dist/*

    # Upload to PyPI
    #- uses: pypa/gh-action-pypi-publish@release/v1
    - uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc #v1.12.4
