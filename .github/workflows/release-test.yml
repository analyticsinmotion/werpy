name: Test Build (No PyPI Upload)

# Set default permissions for all jobs in the workflow
permissions:
  contents: read

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
#  push:
#    branches: [ "main" ]
#  pull_request:
#    branches: [ "main" ]
  # Schedule the workflow to trigger at a specified time each day using a CRON expression
  # schedule:
    #        ┌───────────── minute (0 - 59)
    #        │  ┌───────────── hour (0 - 23)
    #        │  │ ┌───────────── day of the month (1 - 31)
    #        │  │ │ ┌───────────── month (1 - 12 or JAN-DEC)
    #        │  │ │ │ ┌───────────── day of the week (0 - 6 or SUN-SAT)
    #        │  │ │ │ │
    # - cron: '25 0 * * *'  # Runs at 12:25am UTC every day

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }} for ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Every job runs to its end, so that a failed job does not cancel the others.
      fail-fast: false
      matrix:
        # Each job builds the wheels of one architecture and tests them on its
        # runner. The Linux and Windows wheels for Arm are built and tested on
        # Arm runners.
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: windows-latest
            arch: AMD64
          - os: windows-11-arm
            arch: ARM64
          - os: macos-latest
            arch: arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build wheels
        uses: pypa/cibuildwheel@b9e566a2b284570af229f6c2a33673410d0389a3 # v4.3.4
        env:
          CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-* cp315-*"
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_SKIP: "*-win32 *-manylinux_i686"
          # Build the Windows wheels with the MSVC compilers. Meson activates the
          # Visual Studio environment only when it finds no other C compiler, and
          # the Windows runners have GCC on the PATH.
          CIBW_CONFIG_SETTINGS_WINDOWS: "setup-args=--vsenv"
          # Install every built wheel into a clean environment and run the test suite against it
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_EXTRAS: pandas,polars
          CIBW_TEST_COMMAND: pytest {package}/tests
        #    ...
        with:
        #   package-dir: .
          output-dir: wheelhouse
        #   config-file: "{package}/pyproject.toml"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  check_upload_artifacts:
    name: Validate the wheel and distribution files that would be uploaded
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        # unpacks all CIBW artifacts into dist/
        pattern: cibw-*
        path: dist
        merge-multiple: true

    # CHECK: List the files before publishing
    - name: List artifacts before upload
      run: |
        echo "Listing files in ./dist:"
        ls -lh dist/

    # CHECK: Validate the metadata of every distribution
    - name: Check the distributions with twine
      run: pipx run twine check dist/*
