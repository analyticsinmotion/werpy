name: Tests

# Set default permissions for all jobs in the workflow
permissions:
  contents: read

# Controls when the workflow will run
on:
  # Triggers the workflow on every push and pull request
  push:
    branches: [main, development]
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Cancel a run that is still in progress when a newer run starts for the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}${{ matrix.numpy != 'default' && format(' / NumPy {0}', matrix.numpy) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # The NumPy version installed after the package has been built and installed.
        # "default" keeps the version selected by the resolver.
        numpy: ["default"]
        include:
          # This cell runs the wheel with NumPy 1.26, the lowest NumPy minor version
          # that the runtime requirements allow on Python 3.11.
          - os: ubuntu-latest
            python-version: "3.11"
            numpy: "1.26.4"

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          venv-path: ${{ runner.temp }}/venv
          enable-cache: true
          cache-suffix: numpy-${{ matrix.numpy }}

      - name: Build the wheel
        run: uv build --wheel --out-dir dist

      - name: Install the wheel and pytest
        run: uv pip install dist/*.whl pytest

      # The wheel is installed again with NumPy pinned. The resolver selects the
      # other dependencies for that NumPy version.
      - name: Install the wheel with NumPy ${{ matrix.numpy }}
        if: matrix.numpy != 'default'
        run: uv pip install dist/*.whl "numpy==${{ matrix.numpy }}"

      # The remaining steps run outside the repository so that the source tree
      # cannot shadow the installed package.
      - name: Check that the installed package is imported
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'EOF'
          import pathlib
          import sysconfig

          import numpy
          import werpy

          package_dir = pathlib.Path(werpy.__file__).resolve().parent
          platlib = pathlib.Path(sysconfig.get_paths()["platlib"]).resolve()
          print(f"werpy {werpy.__version__} from {package_dir}")
          print(f"numpy {numpy.__version__}")
          if not package_dir.is_relative_to(platlib):
              raise SystemExit(f"werpy was imported from {package_dir}, not from {platlib}")
          EOF

      - name: Run the test suite
        working-directory: ${{ runner.temp }}
        run: python -m pytest "$GITHUB_WORKSPACE/tests"

  coverage:
    name: Coverage / ubuntu-latest / Python 3.13
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
          activate-environment: true
          venv-path: ${{ runner.temp }}/venv
          enable-cache: true
          cache-suffix: coverage

      - name: Build the wheel
        run: uv build --wheel --out-dir dist

      - name: Install the wheel, pytest, pytest-cov and coverage
        run: uv pip install dist/*.whl pytest pytest-cov coverage

      # The suite runs outside the repository so that the source tree cannot
      # shadow the installed package. Coverage is measured on the installed
      # Python modules; the compiled extension is not measured.
      - name: Run the test suite with coverage
        working-directory: ${{ runner.temp }}
        run: python -m pytest "$GITHUB_WORKSPACE/tests" --cov=werpy --cov-report=

      # The [tool.coverage.paths] table in pyproject.toml maps the installed
      # package back to the source tree, so the report paths are repository paths.
      - name: Write the coverage report
        run: |
          python -m coverage combine "$RUNNER_TEMP/.coverage"
          python -m coverage xml

      - name: Upload the coverage report to Codecov
        if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true
          flags: unittests
          fail_ci_if_error: true
