name: Tests

# Set default permissions for all jobs in the workflow
permissions:
  contents: read

# Controls when the workflow will run
on:
  # Triggers the workflow on every push and pull request
  push:
    branches: [main, development]
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Cancel a run that is still in progress when a newer run starts for the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}${{ matrix.numpy != 'default' && format(' / NumPy {0}', matrix.numpy) || '' }}${{ matrix.extras == 'none' && ' / without NumPy, pandas and polars' || '' }}${{ matrix.libraries == 'lowest' && ' / lowest pandas and polars' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # The NumPy version installed after the package has been built and installed.
        # "default" keeps the version selected by the resolver.
        numpy: ["default"]
        # "pandas,polars" installs the wheel with its pandas and polars extras. "none"
        # runs the wheel on the Python standard library alone, without NumPy and
        # without pandas and polars, the optional dependencies of summary() and
        # summaryp().
        extras: ["pandas,polars"]
        # "latest" lets the resolver select the versions of pandas and polars.
        # "lowest" installs pandas 2.2.2 and polars 1.0.0, the lowest versions that
        # the pandas and polars extras allow.
        libraries: ["latest"]
        include:
          # This cell runs the tests with NumPy 1.26.4, so that werpy takes numpy
          # arrays of NumPy 1.x as inputs.
          - os: ubuntu-latest
            python-version: "3.11"
            numpy: "1.26.4"
            extras: "pandas,polars"
          # This cell runs the wheel without NumPy, pandas and polars. The tests that
          # need them are skipped.
          - os: ubuntu-latest
            python-version: "3.14"
            numpy: "default"
            extras: "none"
          # This cell runs the wheel with the lowest versions of pandas and polars that
          # the extras allow. The resolver selects NumPy for that pandas.
          - os: ubuntu-latest
            python-version: "3.11"
            numpy: "default"
            extras: "pandas,polars"
            libraries: "lowest"

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          venv-path: ${{ runner.temp }}/venv
          enable-cache: true
          cache-suffix: numpy-${{ matrix.numpy }}

      - name: Build the wheel
        run: uv build --wheel --out-dir dist

      - name: Install the wheel and pytest
        env:
          EXTRAS: ${{ matrix.extras }}
          LIBRARIES: ${{ matrix.libraries }}
        run: |
          wheel=(dist/*.whl)
          if [ "$EXTRAS" = "none" ]; then
            uv pip install "${wheel[0]}" pytest
          elif [ "$LIBRARIES" = "lowest" ]; then
            uv pip install "${wheel[0]}[$EXTRAS]" pytest "pandas==2.2.2" "polars==1.0.0"
          else
            uv pip install "${wheel[0]}[$EXTRAS]" pytest
          fi

      # The wheel is installed again with NumPy pinned, with the extras of the cell.
      # The resolver selects pandas and the other dependencies for that NumPy version.
      - name: Install the wheel with NumPy ${{ matrix.numpy }}
        if: matrix.numpy != 'default'
        env:
          EXTRAS: ${{ matrix.extras }}
        run: |
          wheel=(dist/*.whl)
          uv pip install "${wheel[0]}[$EXTRAS]" "numpy==${{ matrix.numpy }}"

      # The remaining steps run outside the repository so that the source tree
      # cannot shadow the installed package.
      - name: Check that the installed package is imported
        working-directory: ${{ runner.temp }}
        env:
          EXTRAS: ${{ matrix.extras }}
        run: |
          python - <<'EOF'
          import importlib.metadata
          import importlib.util
          import os
          import pathlib
          import sysconfig

          import werpy

          package_dir = pathlib.Path(werpy.__file__).resolve().parent
          platlib = pathlib.Path(sysconfig.get_paths()["platlib"]).resolve()
          print(f"werpy {werpy.__version__} from {package_dir}")
          # The version of NumPy is read from the metadata of the installed
          # distribution. The cell without pandas and polars must run on the
          # Python standard library alone.
          numpy_found = importlib.util.find_spec("numpy") is not None
          print(f"numpy {importlib.metadata.version('numpy') if numpy_found else 'not installed'}")
          if numpy_found and os.environ["EXTRAS"] == "none":
              raise SystemExit("numpy found, but the cell runs without NumPy")
          extras = os.environ["EXTRAS"].split(",")
          for name in ("pandas", "polars"):
              found = importlib.util.find_spec(name) is not None
              print(f"{name} {'installed' if found else 'not installed'}")
              if found != (name in extras):
                  raise SystemExit(f"{name} found: {found}, but the cell installs {os.environ['EXTRAS']}")
          if not package_dir.is_relative_to(platlib):
              raise SystemExit(f"werpy was imported from {package_dir}, not from {platlib}")
          EOF

      - name: Run the test suite
        working-directory: ${{ runner.temp }}
        run: python -m pytest "$GITHUB_WORKSPACE/tests"

  coverage:
    name: Coverage / ubuntu-latest / Python 3.13
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
          activate-environment: true
          venv-path: ${{ runner.temp }}/venv
          enable-cache: true
          cache-suffix: coverage

      # The line-trace build compiles _metrics.pyx, _weighted.pyx and
      # _normalize_kernel.pyx with the Cython line tracing hooks. Cython does
      # not support line tracing in the Python limited API, so this wheel is
      # built for the ABI of Python 3.13.
      # Only this job uses the wheel. It is never uploaded.
      - name: Build the line-trace wheel
        run: |
          uv build --wheel --out-dir dist -Cbuild-dir=build/linetrace \
            -Csetup-args=-Dlinetrace=true -Csetup-args=-Dpython.allow_limited_api=false

      # The Cython.Coverage plugin of Cython measures the .pyx files. The
      # version is the Cython build requirement in pyproject.toml.
      # pandas and polars are installed so that the tests reach the DataFrame
      # lines of summary() and summaryp(). Two tests import werpy._output
      # again while pandas or polars cannot be imported, to reach the lines for
      # an environment without it.
      - name: Install the wheel, pandas, polars, pytest, pytest-cov, coverage and Cython
        run: uv pip install dist/*.whl pandas polars pytest pytest-cov coverage cython==3.3.0

      # The plugin reads the C file that Cython generated for each module, as
      # <module>.c beside <module>.pyx: beside the installed modules while the
      # tests run, and in the source tree while the report is written.
      - name: Copy the Cython sources and the generated C files
        run: |
          site_werpy="$(python -c 'import sysconfig; print(sysconfig.get_paths()["platlib"])')/werpy"
          for module in _metrics _weighted _normalize_kernel; do
            c_files=(build/linetrace/"$module".*.p/"$module".pyx.c)
            if [ "${#c_files[@]}" -ne 1 ] || [ ! -f "${c_files[0]}" ]; then
              echo "Expected one generated C file of $module, found: ${c_files[*]}" >&2
              exit 1
            fi
            cp "werpy/$module.pyx" "$site_werpy/"
            cp "${c_files[0]}" "$site_werpy/$module.c"
            cp "${c_files[0]}" "werpy/$module.c"
          done

      # The coverage settings of this job. The plugin needs the ctrace core of
      # coverage.py. On Python 3.14 the default core does not run file tracer
      # plugins, and it drops the .pyx files from the report without an error.
      # The paths table is a copy of the [tool.coverage.paths] table in
      # pyproject.toml.
      - name: Write the coverage settings
        run: |
          cat > "$RUNNER_TEMP/coverage-linetrace.toml" <<'EOF'
          [tool.coverage.run]
          plugins = ["Cython.Coverage"]
          core = "ctrace"

          [tool.coverage.paths]
          source = ['werpy', '*/site-packages/werpy']
          EOF

      # The suite runs outside the repository so that the source tree cannot
      # shadow the installed package. Coverage is measured on the installed
      # Python modules and, through the plugin, on the three Cython modules.
      - name: Run the test suite with coverage
        working-directory: ${{ runner.temp }}
        run: |
          python -m pytest "$GITHUB_WORKSPACE/tests" --cov=werpy --cov-report= \
            --cov-config="$RUNNER_TEMP/coverage-linetrace.toml"

      # The paths table maps the installed package back to the source tree, so
      # the report paths are repository paths.
      - name: Write the coverage report
        run: |
          python -m coverage combine --rcfile="$RUNNER_TEMP/coverage-linetrace.toml" "$RUNNER_TEMP/.coverage"
          python -m coverage xml --rcfile="$RUNNER_TEMP/coverage-linetrace.toml"

      # A coverage.py setting that does not run the plugin drops the .pyx files
      # from the report without an error. This step fails the job unless
      # coverage.xml measures the lines of the three Cython modules.
      - name: Check that the report measures the three Cython modules
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET

          classes = {c.get("filename"): c for c in ET.parse("coverage.xml").iter("class")}
          for name in ("werpy/_metrics.pyx", "werpy/_weighted.pyx", "werpy/_normalize_kernel.pyx"):
              lines = classes[name].findall("lines/line") if name in classes else []
              if not lines:
                  raise SystemExit(f"coverage.xml does not measure {name}")
              print(f"{name}: {len(lines)} lines measured")
          EOF

      - name: Upload the coverage report to Codecov
        if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true
          plugins: noop
          flags: unittests
          fail_ci_if_error: true
