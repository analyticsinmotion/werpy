name: Type Check with Mypy

# Set default permissions for all jobs in the workflow
permissions:
  contents: read

# Controls when the workflow will run
on:
  # Triggers the workflow on every push and pull request
  push:
    branches: [main, development]
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Cancel a run that is still in progress when a newer run starts for the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  type-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install the package, mypy and pandas-stubs
        run: |
          python -m pip install --upgrade pip
          pip install mypy pandas-stubs .

      # The files to check and the strictness are set in [tool.mypy] in pyproject.toml
      - name: Run mypy
        run: python -m mypy
