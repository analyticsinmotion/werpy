name: Bandit

# Set default permissions for all jobs in the workflow
permissions:
  contents: read

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Schedule the workflow to trigger at a specified time each day using a CRON expression
  schedule:
    #        ┌───────────── minute (0 - 59)
    #        │  ┌───────────── hour (0 - 23)
    #        │  │ ┌───────────── day of the month (1 - 31)
    #        │  │ │ ┌───────────── month (1 - 12 or JAN-DEC)
    #        │  │ │ │ ┌───────────── day of the week (0 - 6 or SUN-SAT)
    #        │  │ │ │ │
    - cron: '45 7 * * 0'  # Runs at 07:45am UTC every Sunday

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      # required for all workflows
      security-events: write
      # only required for workflows in private repositories
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install Bandit
        run: pip install "bandit[sarif,toml]"

      - name: Run Bandit
        # Bandit's default exclude list, and the benchmarks directory
        run: bandit -x ".svn,CVS,.bzr,.hg,.git,__pycache__,.tox,.eggs,*.egg,./benchmarks" -r . -f sarif -o results.sarif || true

      # Bandit applies its checks to every file of the run. The test suite uses
      # the random module for seeded test data, so this step removes from the
      # report the results with the rule id B311 whose file is under tests/,
      # and keeps every other result. The step stops the job when the report
      # does not have the shape that it reads, so that a change in the output of
      # Bandit cannot remove any other result.
      - name: Remove the B311 results of the tests from the report
        run: |
          python - <<'EOF'
          import json
          import sys

          REPORT = "results.sarif"


          def stop(message):
              sys.exit(f"{REPORT}: {message}. No result was removed.")


          with open(REPORT, encoding="utf-8") as f:
              report = json.load(f)

          runs = report.get("runs") if isinstance(report, dict) else None
          if not isinstance(runs, list) or not runs:
              stop("the report has no runs")

          removed = 0
          for run in runs:
              results = run.get("results") if isinstance(run, dict) else None
              if not isinstance(results, list):
                  stop("a run has no results list")
              kept = []
              for result in results:
                  rule_id = result.get("ruleId") if isinstance(result, dict) else None
                  if not isinstance(rule_id, str) or not rule_id:
                      stop("a result has no rule id")
                  try:
                      path = result["locations"][0]["physicalLocation"]["artifactLocation"]["uri"]
                  except (KeyError, IndexError, TypeError):
                      stop(f"a {rule_id} result has no location")
                  if not isinstance(path, str) or not path:
                      stop(f"a {rule_id} result has no file path")
                  if rule_id == "B311" and path.startswith("tests/"):
                      removed += 1
                  else:
                      kept.append(result)
              run["results"] = kept

          with open(REPORT, "w", encoding="utf-8") as f:
              json.dump(report, f, indent=2)

          print(f"Removed {removed} B311 results of the files under tests/ from {REPORT}")
          EOF

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
